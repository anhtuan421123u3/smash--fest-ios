name: Build Smash Fest iOS (.ipa)

on:
  push:
    branches:
      - build-ipa
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: Pure Kotlin/Native iOS -> Unsigned .ipa
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Core Gameplay & Economy Unit Tests (JVM)
        run: gradle jvmTest --no-daemon --stacktrace

      - name: Compile Pure Kotlin/Native iOS ARM64 Executable
        run: gradle linkReleaseExecutableIosArm64 --no-daemon --stacktrace

      - name: Package & Verify Unsigned SmashFest.ipa
        run: bash scripts/package_ipa.sh

      - name: Upload Downloadable .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmashFest-unsigned-ipa
          path: SmashFest-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release with .ipa (on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Smash Fest! iOS Build #${{ github.run_number }} (Pure Kotlin/Native .ipa)"
          body: |
            ### Smash Fest! — Native iOS Build (100% Pure Kotlin/Native)
            - **Minimum iOS/iPadOS:** 15.0+ (Universal iPhone & iPad)
            - **Package:** `SmashFest-unsigned.ipa` (Ad-hoc signed for Sideloadly / AltStore / TrollStore / ESign)
            - **Features:** 3D SceneKit Aim–Shoot–Smash physics, Chain of Destruction shards, ASMR synthesized audio, 2,000+ levels (Normal/Hard/Super Hard), 5-Lives 30-min regeneration, Carnival Champions Cup, and Offline Mode.
          files: SmashFest-unsigned.ipa
          prerelease: false
